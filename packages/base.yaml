# Logging, web UI, SPI bus and diagnostics. Nothing RF-specific and nothing secret lives
# here - network access and credentials come from network.yaml (own build) or
# network-provisioned.yaml (prebuilt image).

# All logs stay on the device: serial console and the web server's log view.
# Raw pulse trains of unknown frames are printed at DEBUG level.
logger:
  level: DEBUG
  logs:
    # Entity state chatter would drown the RF log.
    sensor: INFO
    text_sensor: INFO
    select: INFO
    button: INFO
    remote_receiver: INFO

web_server:
  port: 80
  version: 3
  local: true  # serve the UI from flash - works without internet access
  log: true
  ota: false  # firmware only via the encrypted OTA, never via plaintext HTTP

spi:
  clk_pin: ${spi_clk_pin}
  miso_pin:
    number: ${spi_miso_pin}
    # GPIO5 is a strapping pin, but it is safe as MISO: both CC1101s keep SO tri-stated
    # while their CS is high, so nothing drives the pin during reset.
    ignore_strapping_warning: true
  mosi_pin: ${spi_mosi_pin}

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome version
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: IP address

button:
  - platform: restart
    name: Restart
