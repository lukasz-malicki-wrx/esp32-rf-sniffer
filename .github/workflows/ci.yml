name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff yamllint clang-format -c requirements-dev.txt
      - name: ruff
        run: |
          ruff check components scripts
          ruff format --check components scripts
      - name: clang-format
        run: clang-format --dry-run --Werror components/rf_bridge/*.h components/rf_bridge/*.cpp tests/*.cpp
      - name: yamllint
        run: yamllint --strict .

  wiring:
    name: Wiring diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install wireviz -c requirements-dev.txt
      - name: Render
        run: |
          for source in docs/wiring-*.yml; do
            wireviz --format s --output-dir "$RUNNER_TEMP/wiring" "$source"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wiring-diagrams
          path: ${{ runner.temp }}/wiring/*.svg

  unit-tests:
    name: Unit tests (host, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base  # rf-sniffer.yaml as shipped
            config: rf-sniffer.yaml
          - variant: full  # every optional package + every action and trigger
            config: rf-sniffer-full.yaml
          - variant: web  # prebuilt image for the browser installer
            config: rf-sniffer-web.yaml
          - variant: minimal  # README "use in your own project" example
            config: tests/esphome/minimal.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install esphome -c requirements-dev.txt
      - name: Prepare config
        run: |
          cp secrets.example.yaml secrets.yaml
          # Enable every optional package, plus a package that uses every action and trigger.
          sed -E 's/^  # (dooya_blinds|home_assistant):/  \1:/' rf-sniffer.yaml > rf-sniffer-full.yaml
          echo "  ci_actions: !include tests/esphome/actions.yaml" >> rf-sniffer-full.yaml
      - uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: >-
            esphome-${{ hashFiles('requirements-dev.txt') }}-${{ matrix.variant }}-
            ${{ hashFiles('*.yaml', 'packages/**', 'components/**') }}
          restore-keys: esphome-${{ hashFiles('requirements-dev.txt') }}-${{ matrix.variant }}-
      - name: Validate
        run: esphome config ${{ matrix.config }}
      - name: Compile
        run: esphome compile ${{ matrix.config }}
